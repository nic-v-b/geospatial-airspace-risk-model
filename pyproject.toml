[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-airspace-risk"
version = "0.1.0"
description = "Reference implementation of a DGGS-style geospatial airspace risk methodology."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Nicolas Vincent-Boulay"}]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
